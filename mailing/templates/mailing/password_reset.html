{% extends "mailing/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body p-4">

                <h1 class="page-title mb-3">
                    Reset your password
                </h1>

                <p class="text-muted">
                    Enter the email address associated with your account.
                </p>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-pink"
                    >
                        Send reset link
                    </button>

                </form>

                <a
                    href="{% url 'login' %}"
                    class="btn btn-link px-0 mt-3"
                >
                    ← Back to login
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
